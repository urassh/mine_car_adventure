<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualization Final</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="score-overlay"></div>
    <div id="question-overlay"></div>
    <div id="countdown-overlay"></div>
    <div id="result-overlay">
      <div class="result-verdict"></div>
      <div class="result-explanation"></div>
    </div>
    <div id="choices-overlay">
      <div class="choice" data-direction="left">
        <div class="choice-frame">
          <div class="choice-label"></div>
        </div>
      </div>
      <div class="choice" data-direction="right">
        <div class="choice-frame">
          <div class="choice-label"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
