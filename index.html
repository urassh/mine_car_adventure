<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualization Final</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="score-overlay" class="hidden"></div>
    <div id="question-overlay" class="hidden"></div>
    <div id="countdown-overlay" class="hidden"></div>
    <div id="result-overlay" class="hidden">
      <div class="result-verdict"></div>
      <div class="result-explanation"></div>
    </div>
    <div id="sparkle-layer"></div>
    <div id="choices-overlay" class="hidden">
      <div class="choice" data-direction="left">
        <div class="choice-frame">
          <div class="choice-label"></div>
        </div>
        <div class="choice-voters"></div>
      </div>
      <div class="choice" data-direction="right">
        <div class="choice-frame">
          <div class="choice-label"></div>
        </div>
        <div class="choice-voters"></div>
      </div>
    </div>
    <div id="mode-hint" class="hidden">Space キーを押して選択</div>
    <div id="title-overlay" class="hidden">
      <div class="title-card">
        <div class="title-heading">トロッコアドベンチャー</div>
        <button class="title-start" type="button">スタート</button>
        <div class="title-hint">Enter / Space でも開始できます</div>
      </div>
    </div>
    <div id="lobby-overlay" class="hidden">
      <div class="lobby-card">
        <div class="lobby-heading">トロッコ探検隊メンバー一覧</div>
        <div class="lobby-sub">仲間が集まるのを待っています…</div>
        <div class="lobby-join">
          <canvas class="lobby-qr"></canvas>
          <div class="lobby-join-text">
            <div class="lobby-join-instr">スマホでQRを読み取って参加</div>
            <a class="lobby-join-url" target="_blank" rel="noopener"></a>
          </div>
        </div>
        <ul class="lobby-members"></ul>
        <div class="lobby-actions">
          <button class="lobby-start" type="button">出発する</button>
        </div>
        <div class="lobby-hint">Enter / Space でも出発できます</div>
      </div>
    </div>
    <div id="final-result-overlay" class="hidden">
      <div class="final-result-card">
        <div class="final-result-heading">リザルト</div>
        <div class="final-score"></div>
        <div class="final-actions">
          <button class="next" type="button">タイトルへ</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
